name: arm64 tuning (temporary, #826)

# Second run (default, A/A and no-PGO builds). Temporary measurement for docs/perf/arm64-tuning.md; removed before the PR is ready.
# Builds every arm64 release target with release.yml's PGO, once as shipped (no target-cpu) and
# once per candidate -C target-cpu, then on the same runner: whole-corpus output hashes against
# the x86-64 v1 musl build, an a*b+c contraction probe, and interleaved timing on full.tsv.

# workflow_dispatch only finds workflows on the default branch, so a push to this branch with a
# change to the measurement itself starts it.
on:
  workflow_dispatch:
  push:
    branches: ["perf/826-arm64-tuning"]
    paths: [".github/workflows/arm64-tuning.yml", "scripts/bench/arm64_tuning.py"]

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"

jobs:
  x86-reference:
    name: x86-64 v1 reference hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target x86_64-unknown-linux-musl
          rustup default "$RUST_VERSION"
      - name: Build v1 (the plain compat build)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p graphviz-pure-cli --bin graphviz-pure
      - name: Hash the corpus output
        run: python3 -I scripts/bench/arm64_tuning.py manifest target/x86_64-unknown-linux-musl/release/graphviz-pure --out "$RUNNER_TEMP/x86-v1.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-x86-v1
          path: ${{ runner.temp }}/x86-v1.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: PGO ${{ matrix.target }} ${{ matrix.cpu }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, cpu: default }
          - { target: aarch64-apple-darwin, runner: macos-15, cpu: default2 }
          - { target: aarch64-apple-darwin, runner: macos-15, cpu: nopgo }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, cpu: default }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, cpu: default2 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, cpu: nopgo }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, cpu: default }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, cpu: default2 }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, cpu: nopgo }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      # Second run: release.yml's flags only. default2 is a second, independently trained PGO
      # build of the shipped configuration (an A/A pair); nopgo is the same flags without PGO.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      PYTHON: ${{ contains(matrix.target, 'windows') && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component llvm-tools --target "$TARGET"
          rustup default "$RUST_VERSION"
      - name: Build with profile-guided optimisation (as release.yml)
        if: matrix.cpu != 'nopgo'
        run: '"$PYTHON" scripts/build-pgo.py --target "$TARGET" --profiles "$RUNNER_TEMP/pgo"'
      - name: Build without PGO
        if: matrix.cpu == 'nopgo'
        run: |
          cargo build --release --locked --target "$TARGET" -p graphviz-pure-cli --bin graphviz-pure
          mkdir -p "$RUNNER_TEMP/pgo" && echo '{"pgo": false}' > "$RUNNER_TEMP/pgo/build-info.json"
      - name: Math unit tests with these flags
        run: cargo test --release --locked --target "$TARGET" -p graphviz-pure-core --lib math
      - name: Collect
        run: |
          mkdir -p out
          exe=target/$TARGET/release/graphviz-pure
          case "$TARGET" in *windows*) exe=$exe.exe ;; esac
          cp "$exe" out/
          cp "$RUNNER_TEMP/pgo/build-info.json" out/
          "$PYTHON" -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$exe" | tee out/sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}-${{ matrix.cpu }}
          path: out/
          if-no-files-found: error
          retention-days: 90

  measure:
    name: Measure ${{ matrix.target }}
    needs: [x86-reference, build]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15, cpus: "default default2 nopgo" }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, cpus: "default default2 nopgo" }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, cpus: "default default2 nopgo" }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      CPUS: ${{ matrix.cpus }}
      PYTHON: ${{ contains(matrix.target, 'windows') && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-${{ matrix.target }}-*
          path: bins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest-x86-v1
          path: ref
      - name: Runner CPU and binaries
        run: |
          mkdir -p results
          case "$RUNNER_OS" in
            Linux) lscpu | tee results/cpu.txt; grep -m1 Features /proc/cpuinfo | tee -a results/cpu.txt ;;
            macOS) sysctl machdep.cpu hw.ncpu hw.optional | tee results/cpu.txt ;;
            Windows) powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List *" | tee results/cpu.txt ;;
          esac
          for cpu in $CPUS; do
            chmod +x bins/bin-$TARGET-$cpu/graphviz-pure* || true
            echo "$cpu $(cat bins/bin-$TARGET-$cpu/sha256.txt)" | tee -a results/sha256.txt
            cp bins/bin-$TARGET-$cpu/build-info.json results/build-info-$cpu.json
          done
      - name: rustc does not contract a*b+c for any candidate CPU
        run: |
          cat > "$RUNNER_TEMP/probe.rs" <<'EOF'
          #[unsafe(no_mangle)] pub fn madd(a: f64, b: f64, c: f64) -> f64 { a * b + c }
          #[unsafe(no_mangle)] pub fn msub(a: f64, b: f64, c: f64) -> f64 { c - a * b }
          #[unsafe(no_mangle)] pub fn dot(a: &[f64; 4], b: &[f64; 4]) -> f64 { a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3] }
          #[unsafe(no_mangle)] pub fn fused(a: f64, b: f64, c: f64) -> f64 { a.mul_add(b, c) }
          EOF
          for cpu in $CPUS; do
            flag=""
            rustc --edition=2024 --crate-type=lib --emit=asm -C opt-level=3 --target "$TARGET" $flag \
              "$RUNNER_TEMP/probe.rs" -o "results/probe-$cpu.s"
            n=$(grep -cE '^\s+(fn?m(add|sub|la|ls|ad|sb))\b' "results/probe-$cpu.s" || true)
            echo "$cpu: $n fused instructions (expected 1, from mul_add)" | tee -a results/probe.txt
            [ "$n" = 1 ]
          done
      - name: Whole corpus byte-identical with x86-64 v1
        run: |
          for cpu in $CPUS; do
            exe=bins/bin-$TARGET-$cpu/graphviz-pure
            case "$TARGET" in *windows*) exe=$exe.exe ;; esac
            "$PYTHON" -I scripts/bench/arm64_tuning.py manifest "$exe" --out "results/manifest-$cpu.json"
          done
          "$PYTHON" -I scripts/bench/arm64_tuning.py compare ref/x86-v1.json results/manifest-*.json | tee results/identity.txt
      - name: perf counters available?
        id: perf
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y "linux-tools-$(uname -r)" linux-tools-common > /dev/null 2>&1 || true
          if perf stat -x , -e instructions:u,cycles:u -- true 2> results/perf-probe.txt && grep -q '^[0-9]' results/perf-probe.txt; then
            echo "flag=--perf" >> "$GITHUB_OUTPUT"
          fi
          cat results/perf-probe.txt || true
      - name: Interleaved timing on full.tsv
        env:
          PERF_FLAG: ${{ steps.perf.outputs.flag }}
        run: |
          "$PYTHON" -I scripts/bench/synth.py --out "$RUNNER_TEMP/synth" > /dev/null
          builds=()
          for cpu in $CPUS; do
            exe=bins/bin-$TARGET-$cpu/graphviz-pure
            case "$TARGET" in *windows*) exe=$exe.exe ;; esac
            builds+=("$cpu=$exe")
          done
          "$PYTHON" -I scripts/bench/arm64_tuning.py bench --set scripts/bench/sets/full.tsv \
            --synth-dir "$RUNNER_TEMP/synth" --out "results/bench-$TARGET.json" $PERF_FLAG "${builds[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-${{ matrix.target }}
          path: results/
          retention-days: 90
