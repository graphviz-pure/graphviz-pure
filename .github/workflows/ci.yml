name: CI

on:
  pull_request:
  # The merge queue tests each pull request merged onto master and the PRs ahead of it; its
  # required checks only report if they run on this event too.
  merge_group:
    types: [checks_requested]
  push:
    branches: ["master", "opus5.5/**"]

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; master runs all complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# GitHub-hosted runners, which are free for a public repository. The build and test jobs are
# skipped when the files they read already passed this workflow (scripts/ci-result-cache.sh), so a
# change to documentation or the site's pages runs none of them; a skipped required check counts
# as passed.
jobs:
  lookup:
    name: Earlier result for these inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # list the marker artifacts of earlier runs
    outputs:
      hit: ${{ steps.lookup.outputs.hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: scripts/ci-result-cache.sh lookup ci

  verify:
    name: Format, Clippy, Test & WASM Check
    needs: lookup
    if: needs.lookup.outputs.hit != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable Rust toolchain (rustup is on every runner)
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown --target wasm32-wasip1 && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Fails when a module of the layout or geom crates gains an unwrap, expect, index or
      # integer-overflow site (tests/panic-sites.tsv; docs/porting/crashes.md).
      - name: Panic-site ratchet
        run: scripts/panic-sites.sh
      # The corpus ratchets (crates/graphviz-pure-diff/tests/*_fidelity.rs) check
      # tests/golden/*.portable.json, the same on every platform.
      - name: Run Workspace Tests
        run: cargo test --workspace
      - name: Check WASM Target
        run: cargo check --target wasm32-unknown-unknown -p graphviz-pure-wasm
      # The command line's WASI build, which releases publish to Wasmer (release.yml's wasi job).
      - name: Check WASI Target
        run: cargo check --target wasm32-wasip1 -p graphviz-pure-cli

  msrv:
    name: MSRV
    needs: lookup
    if: needs.lookup.outputs.hit != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the declared MSRV (rustup is on every runner)
        shell: bash
        run: |
          msrv=$(awk -F '"' '/^rust-version = / { print $2; exit }' Cargo.toml)
          test -n "$msrv"
          grep -qx "msrv = \"$msrv\"" clippy.toml || { echo "clippy.toml msrv != rust-version"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal && rustup default "$msrv"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check the workspace on the declared MSRV
        run: cargo check --workspace --locked

  wasm-e2e:
    name: WASM end-to-end (Node)
    needs: lookup
    if: needs.lookup.outputs.hit != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable Rust toolchain (rustup is on every runner)
        shell: bash
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock exactly.
      - name: Read wasm-bindgen version from Cargo.lock
        id: wb
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache wasm-bindgen-cli
        id: wb-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wb.outputs.version }}
      - name: Install wasm-bindgen-cli
        if: steps.wb-cache.outputs.cache-hit != 'true'
        env:
          WB_VERSION: ${{ steps.wb.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
      - name: Check wasm-bindgen-cli version
        env:
          WB_VERSION: ${{ steps.wb.outputs.version }}
        run: wasm-bindgen --version | grep -Fx "wasm-bindgen $WB_VERSION"
      - name: Build the wasm package
        run: |
          cargo build --release --target wasm32-unknown-unknown -p graphviz-pure-wasm
          wasm-bindgen --target nodejs --out-dir "$RUNNER_TEMP/gvwasm/pkg" \
            target/wasm32-unknown-unknown/release/graphviz_pure_wasm.wasm
          node scripts/export-graphviz-error.mjs "$RUNNER_TEMP/gvwasm/pkg/graphviz_pure_wasm.js"
      # Fails if a file of tests/golden/e2e-baseline.libm-matched.portable.json stops matching C
      # (computing with the same math functions).
      - name: Run wasm e2e against the baseline
        run: node scripts/wasm-e2e.mjs --pkg "$RUNNER_TEMP/gvwasm/pkg" --hashes "$RUNNER_TEMP/wasm-hashes.json"
      # Every build uses the same math functions, so wasm32 and Linux must agree on every
      # output, matching C or not.
      - name: Compare wasm output with native Linux output
        run: |
          cargo build --release -p graphviz-pure-diff
          target/release/gv-diff e2e --hashes "$RUNNER_TEMP/native-hashes.json"
          cmp "$RUNNER_TEMP/native-hashes.json" "$RUNNER_TEMP/wasm-hashes.json"

  # The npm package (wasm-bindgen --target web, built as the release builds it) loaded the way a
  # user of each runtime would, rendering the gallery samples byte for byte; see
  # scripts/wasm-runtimes/run.mjs. Deno, Bun, wrangler and Playwright come from that
  # directory's package-lock.json (third-party setup actions are not allowed); the browser is
  # the runner image's Google Chrome.
  wasm-runtimes:
    name: WASM package (Node.js, Deno, Bun, Workers, Chrome)
    needs: lookup
    if: needs.lookup.outputs.hit != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable Rust toolchain (rustup is on every runner)
        shell: bash
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm-npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/wasm-runtimes/package-lock.json
      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock exactly.
      - name: Read wasm-bindgen version from Cargo.lock
        id: wb
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache wasm-bindgen-cli
        id: wb-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wb.outputs.version }}
      - name: Install wasm-bindgen-cli
        if: steps.wb-cache.outputs.cache-hit != 'true'
        env:
          WB_VERSION: ${{ steps.wb.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
      # Same command as the release's npm-package job (no wasm-opt on the runner).
      - name: Build the npm package
        working-directory: web
        run: npm run build:wasm
      # The hand-checked .d.ts replaces the generated one inside build:wasm.
      # This compares that generated file, written to a temp dir, with the source.
      - name: Hand-checked types match wasm-bindgen's exports
        run: |
          wasm-bindgen --target web --remove-name-section --remove-producers-section \
            --out-dir "$RUNNER_TEMP/gvtypes" \
            target/wasm32-unknown-unknown/release/graphviz_pure_wasm.wasm
          node scripts/check-wasm-dts.mjs "$RUNNER_TEMP/gvtypes/graphviz_pure_wasm.d.ts" \
            web/graphviz_pure_wasm.d.ts
      # The release packs the same way (prepack copies the licence files in); JSR publishes the
      # tarball's files that jsr.json includes.
      - name: The npm and JSR packages carry the licence files
        run: |
          (cd web && npm pack --pack-destination "$RUNNER_TEMP")
          python3 scripts/check-package-notices.py "$RUNNER_TEMP"/graphviz-pure-wasm-*.tgz
      # Install without running any package's lifecycle scripts, check every package's registry
      # signature, and only then run the scripts (which unpack the deno, bun and workerd binaries).
      - name: Install the runtimes (no scripts)
        working-directory: scripts/wasm-runtimes
        run: npm ci --ignore-scripts
      - name: Verify npm package signatures
        working-directory: scripts/wasm-runtimes
        run: npm audit signatures
      - name: Run the runtimes' install scripts
        working-directory: scripts/wasm-runtimes
        run: npm rebuild
      # deno 2.9.6 is the pinned devDependency unpacked by the rebuild above. No separate toolchain.
      - name: Typecheck the hand-checked package types
        working-directory: scripts/wasm-runtimes
        env:
          DENO_NO_UPDATE_CHECK: "1"
        run: |
          cmp ../../web/graphviz_pure_wasm.d.ts ../../web/pkg/graphviz_pure_wasm.d.ts
          ./node_modules/.bin/deno check --no-lock types.ts
      - name: Run the package in every runtime
        working-directory: scripts/wasm-runtimes
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node run.mjs

  supply-chain:
    name: Supply chain (cargo-deny, zizmor)
    # Always runs: the advisory database changes even when the tree does not.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vendored resvg crates must keep calling libm, not f32/f64 methods (#339).
      - name: Vendored raster math stays on the libm crate
        run: scripts/check-vendor-math.sh
      - name: Install the stable Rust toolchain (rustup is on every runner)
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # The tools are built from crates.io at a pinned version with their own lockfiles.
      # cargo-about's version is also pinned in scripts/third-party-licenses.sh.
      - name: Cache the audit tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/zizmor
            ~/.cargo/bin/cargo-about
          key: audit-tools-${{ runner.os }}-cargo-deny-0.18.9-zizmor-1.31.1-cargo-about-0.9.2
      - name: Install cargo-deny, zizmor and cargo-about
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-deny@0.18.9 zizmor@1.31.1
          cargo install --locked --features cli cargo-about@0.9.2
      # RustSec advisories, licences (deny.toml), duplicate versions and allowed sources.
      - name: cargo deny check
        run: cargo deny check
      # THIRD-PARTY-LICENSES.md must match Cargo.lock: the licences and copyright notices of every
      # crate in the release binaries and the wasm package (about.toml).
      - name: THIRD-PARTY-LICENSES.md is current
        run: scripts/third-party-licenses.sh --check
      # Each crate published to crates.io carries LICENSE and NOTICE (copies of the root files,
      # which must match them), and the crates with third-party code their licences.
      - name: The crates carry the licence files
        run: scripts/check-crate-notices.sh
      # Security lint of every workflow: injection, credential persistence, triggers, pinning.
      - name: zizmor
        run: zizmor --persona=pedantic --offline .github/workflows

  # What in a pull request needs a careful read (sensitive files, new dependencies, weakened
  # baselines, process and network calls, Trojan Source characters); see docs/pull-requests.md.
  # The scanner comes from the base branch, so a pull request cannot edit what checks it, and it
  # only reads git objects: nothing from the pull request runs here.
  pr-risk:
    name: PR risk report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Scan the change against the base branch
        shell: bash
        run: |
          if git show HEAD^1:scripts/pr-risk.py > "$RUNNER_TEMP/pr-risk.py"; then
            python3 -I "$RUNNER_TEMP/pr-risk.py" HEAD^1 HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The base branch has no scripts/pr-risk.py yet." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # Records that these inputs passed, so a later run with the same inputs skips verify, msrv,
  # wasm-e2e and wasm-runtimes.
  record:
    name: Record the result for these inputs
    needs: [verify, msrv, wasm-e2e, wasm-runtimes]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: marker
        run: |
          echo "name=$(scripts/ci-result-cache.sh name ci)" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_RUN_ID" > "$RUNNER_TEMP/passed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.marker.outputs.name }}
          path: ${{ runner.temp }}/passed
          retention-days: 30
