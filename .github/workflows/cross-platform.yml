name: Cross-platform

# Every build uses the same math library (graphviz_pure_core::math, pure Rust), so every
# platform should write the same bits. This workflow checks that it does, with default builds
# and no feature flags: each platform renders the whole corpus (the -Tsvg hash of every input,
# through all eight engines) and the site's gallery samples (full SVG bytes), and the compare
# job fails unless every platform's output is byte-identical. The comparison is published on the site's Cross-platform page, where the
# reader's browser draws each platform's SVG with one renderer and diffs the pixels.
#
# The last job builds the documentation site (site/, Astro Starlight, with the WASM package for
# its live checks and rustdoc under /api/) from this run's results and uploads it as the `site`
# artifact. It runs only when something the site shows changed: the files the platform renders
# read, or the site's own sources (site/, docs/, CHANGELOG.md, scripts/site-*). The
# graphviz-pure.github.io repository publishes it: its workflow polls for the newest successful
# run on master that has a `site` artifact and deploys it, so neither repository holds a
# credential for the other. The site's fidelity data, gallery outputs and C references are
# committed, since they need the C oracle, which CI does not have.
#
# Jobs run on GitHub-hosted runners, which are free for a public repository. The platform renders
# and the comparison are skipped when the files they read already passed this workflow
# (scripts/ci-result-cache.sh), so a change to documentation or the site's pages renders nothing,
# and the site job takes the cross-platform results from the run that passed those files.
#
# macOS x86-64 runs after the merge only (push to master, manual runs): its runner is the slowest
# (a median 27 minutes against 10 for Windows), it has never failed where the other platforms
# passed, and Linux and Windows test x86-64 while macOS arm64 tests macOS. Pull requests and the
# merge queue compare the other five platforms, under the result-cache kind `cross-platform`; a
# master push compares all six under `cross-platform-full`, and a failure there opens an issue.

on:
  pull_request:
  # The merge queue's required checks (see ci.yml).
  merge_group:
    types: [checks_requested]
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; master runs all complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lookup:
    name: Earlier result for these inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # list the marker artifacts of earlier runs
    outputs:
      hit: ${{ steps.lookup.outputs.hit }}
      run_id: ${{ steps.lookup.outputs.run_id }}
      site: ${{ steps.site.outputs.build }}
      kind: ${{ steps.platforms.outputs.kind }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      expect: ${{ steps.platforms.outputs.expect }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The platforms this run renders: all six after the merge, all but macOS x86-64 before it.
      - id: platforms
        env:
          EVENT: ${{ github.event_name }}
        run: |
          full=false
          case "$EVENT" in push | workflow_dispatch) full=true ;; esac
          platforms='[
            {"id": "linux-x86_64", "label": "Linux x86-64", "runner": "ubuntu-24.04"},
            {"id": "linux-arm64", "label": "Linux arm64", "runner": "ubuntu-24.04-arm"},
            {"id": "windows-x86_64", "label": "Windows x86-64", "runner": "windows-2025"},
            {"id": "macos-arm64", "label": "macOS arm64", "runner": "macos-15"},
            {"id": "macos-x86_64", "label": "macOS x86-64", "runner": "macos-15-intel"}]'
          kind=cross-platform
          if [ "$full" = true ]; then
            kind=cross-platform-full
          else
            platforms=$(jq -c 'map(select(.id != "macos-x86_64"))' <<< "$platforms")
          fi
          platforms=$(jq -c . <<< "$platforms")
          expect=$(jq -r 'map(.id) + ["wasm32"] | join(",")' <<< "$platforms")
          echo "Platforms: $expect"
          { echo "kind=$kind"; echo "platforms=$platforms"; echo "expect=$expect"; } >> "$GITHUB_OUTPUT"
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          KIND: ${{ steps.platforms.outputs.kind }}
        run: scripts/ci-result-cache.sh lookup "$KIND"
      # Whether the site needs building: yes when a file the renders read or one of the site's
      # own sources differs from the base (the previous master, the pull request's base or the
      # merge queue's base), and always when there is no base to compare or on a manual run.
      - id: site
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          build=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "${BASE//0/}" ] \
            && git fetch -q --depth=1 origin "$BASE" \
            && ! scripts/ci-result-cache.sh changed cross-platform "$BASE" \
            && git diff --quiet "$BASE" HEAD -- site docs CHANGELOG.md 'scripts/site-*'; then
            build=false
          fi
          echo "Build the site: $build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  native:
    name: ${{ matrix.label }}
    needs: lookup
    if: needs.lookup.outputs.hit != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.lookup.outputs.platforms) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable Rust toolchain (rustup is on every runner)
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.id }}
      - name: Render the corpus and the samples
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          ID: ${{ matrix.id }}
          LABEL: ${{ matrix.label }}
        run: scripts/cross-platform-render.sh "out/$ID" "$ID" "$LABEL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xp-${{ matrix.id }}
          path: out/${{ matrix.id }}
      # The full test suite, so Windows and arm64 Linux are tested like x86-64 Linux in ci.yml.
      - name: Run the workspace tests
        if: matrix.id != 'linux-x86_64'
        run: cargo test --workspace --release

  wasm:
    name: WebAssembly (Node.js)
    needs: lookup
    if: needs.lookup.outputs.hit != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable Rust toolchain (rustup is on every runner)
        shell: bash
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm32
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Read wasm-bindgen version from Cargo.lock
        id: wb
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache wasm-bindgen-cli
        id: wb-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wb.outputs.version }}
      - name: Install wasm-bindgen-cli
        if: steps.wb-cache.outputs.cache-hit != 'true'
        env:
          WB_VERSION: ${{ steps.wb.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked
      - name: Build the wasm package
        run: |
          cargo build --release --target wasm32-unknown-unknown -p graphviz-pure-wasm
          wasm-bindgen --target nodejs --out-dir "$RUNNER_TEMP/pkg" target/wasm32-unknown-unknown/release/graphviz_pure_wasm.wasm
      - name: Render the corpus and the samples
        run: |
          node scripts/cross-platform-wasm.mjs "$RUNNER_TEMP/pkg" out/wasm32
          node scripts/wasm-e2e.mjs --pkg "$RUNNER_TEMP/pkg" --hashes out/wasm32/hashes.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xp-wasm32
          path: out/wasm32

  compare:
    name: Compare every platform's output
    needs: [lookup, native, wasm]
    # Runs when a platform job failed (a missing platform fails the comparison), not when the
    # run was cancelled or these inputs already passed.
    if: ${{ !cancelled() && needs.lookup.outputs.hit != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: xp-*
          path: xp
      - name: Rename the platform directories
        run: for d in xp/xp-*; do mv "$d" "xp/${d#xp/xp-}"; done
      - name: Compare
        shell: bash  # -eo pipefail, so a difference fails the step through the tee
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECT: ${{ needs.lookup.outputs.expect }}
        run: |
          # Every platform must have uploaded its outputs; a failed job shows up as missing.
          python3 scripts/cross-platform-compare.py xp \
            --expect "$EXPECT" \
            --commit "$COMMIT" --run-url "$RUN_URL" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # The site's Cross-platform page is built from this (the site job below).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: cross-platform-site
          path: |
            xp/manifest.json
            xp/*/platform.json
            xp/*/samples/

  site:
    name: Build the documentation site
    needs: [lookup, compare]
    # A failed comparison is still published, so the page shows it; a cancelled run is not. When
    # nothing the site shows changed, the deploy keeps the `site` of an earlier master run.
    if: ${{ !cancelled() && needs.lookup.outputs.site == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # download the cross-platform results of the run that passed these inputs
    env:
      # Served at the root of https://graphviz-pure.github.io/ (the graphviz-pure.github.io repo).
      SITE_BASE: /
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable Rust toolchain (rustup is on every runner)
        shell: bash
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock exactly.
      - name: Read wasm-bindgen version from Cargo.lock
        id: wb
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache wasm-bindgen-cli
        id: wb-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wb.outputs.version }}
      - name: Install wasm-bindgen-cli
        if: steps.wb-cache.outputs.cache-hit != 'true'
        env:
          WB_VERSION: ${{ steps.wb.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$WB_VERSION" --locked

      # Same build as the npm package (opt-level z, fat LTO); wasm-opt is skipped when absent.
      - name: Build the WASM package for the live checks
        run: scripts/site-wasm.sh

      - name: Build rustdoc
        run: cargo doc --workspace --no-deps

      # A failed comparison is still published: the page then shows the differences.
      - name: Use this run's cross-platform results
        if: needs.lookup.outputs.hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cross-platform-site
          path: site/public/cross-platform
      - name: Use the cross-platform results of the run that passed these inputs
        if: needs.lookup.outputs.hit == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cross-platform-site
          path: site/public/cross-platform
          run-id: ${{ needs.lookup.outputs.run_id }}
          github-token: ${{ github.token }}

      # Install without running any package's lifecycle scripts, check every package's registry
      # signature (and provenance, where published), and only then run the scripts.
      - name: Install site dependencies (no scripts)
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Verify npm package signatures
        working-directory: site
        run: npm audit signatures
      - name: Run the dependencies' install scripts
        working-directory: site
        run: npm rebuild

      # prebuild copies docs/porting into the site and the issue manifest into What's left;
      # postbuild checks every internal link.
      - name: Build the site
        working-directory: site
        run: npm run build

      - name: Add rustdoc under /api/
        run: |
          mkdir -p site/dist/api
          cp -R target/doc/. site/dist/api/
          rm -f site/dist/api/.lock
          cat > site/dist/api/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>graphviz-pure API</title>
          <meta http-equiv="refresh" content="0; url=graphviz_pure/index.html">
          <link rel="canonical" href="graphviz_pure/index.html">
          <p><a href="graphviz_pure/index.html">graphviz_pure</a>, the pipeline. Other crates are listed in its sidebar.</p>
          EOF
          node scripts/site-check-links.mjs site/dist

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist
          # The deploy may serve this artifact until the site next changes.
          retention-days: 90

  # Records that these inputs passed, so a later run with the same inputs skips the renders.
  record:
    name: Record the result for these inputs
    needs: [lookup, compare, site]
    # Only after a passing comparison, and a site build that passed or had nothing to build.
    if: ${{ !cancelled() && needs.compare.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.site.result) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: marker
        env:
          KIND: ${{ needs.lookup.outputs.kind }}
        run: |
          echo "name=$(scripts/ci-result-cache.sh name "$KIND")" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_RUN_ID" > "$RUNNER_TEMP/passed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.marker.outputs.name }}
          path: ${{ runner.temp }}/passed
          retention-days: 30

  # Nobody waits on a master run, so a platform that fails there opens an issue (macOS x86-64 is
  # only tested here), or comments on the one still open.
  report:
    name: Open an issue for a failed master run
    needs: [native, wasm, compare]
    if: ${{ failure() && github.event_name == 'push' && github.repository == 'graphviz-pure/graphviz-pure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write # open the issue that reports the failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/ci-report-failure.sh "Cross-platform fails on master" bug \
            "The post-merge cross-platform run at $COMMIT failed: $RUN_URL. macOS x86-64 is tested only after the merge, so check it first."
