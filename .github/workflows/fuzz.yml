name: Fuzzing

# Coverage-guided fuzzing of the cargo-fuzz targets in fuzz/ with ClusterFuzzLite
# (.clusterfuzzlite/): panics, hangs and running out of memory on crafted DOT. No C oracle; the
# differential fuzzer against C Graphviz is separate (docs/porting/fuzzing.md).
#
# - schedule, every 6 hours: a batch run that grows the corpus, then corpus pruning. The corpus,
#   the crashes and the builds are kept as artifacts of this workflow.
# Pull requests are not fuzzed here: the job took 25 minutes on every push of every pull request
# and found one crash in 141 runs, while the agents fixing bugs waited for it. A failed scheduled
# run opens an issue (scripts/ci-report-failure.sh), labelled `crash` when the run uploaded a
# crash; the commits merged since the previous run are the suspects.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every run reads and writes the one corpus, so runs never overlap: a run that wrote its corpus
# while another pruned would undo the pruning.
concurrency:
  group: ${{ github.workflow }}-corpus
  cancel-in-progress: false

jobs:
  batch:
    name: Batch fuzzing and corpus pruning
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.repository == 'graphviz-pure/graphviz-pure'
    runs-on: ubuntu-24.04
    # About 15 minutes to build, 60 to fuzz and up to 50 to prune.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read # the corpus kept by earlier runs
    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ github.token }}
          sanitizer: address
      - name: Fuzz every target (6 min each)
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          mode: batch
          sanitizer: address
          fuzz-seconds: 3600
          minimize-crashes: true
      # Batch runs only add to the corpus; pruning drops the inputs that add no coverage.
      # ClusterFuzzLite splits fuzz-seconds across the targets and gives each one's corpus merge
      # that long: at 600 (60 s each), the merge of render_twopi's corpus after a batch run timed
      # out (#439). Most merges take far less, and a target that finishes early leaves its time to
      # the others.
      - name: Prune the corpus (up to 5 min each)
        if: ${{ !cancelled() }}
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ github.token }}
          mode: prune
          sanitizer: address
          fuzz-seconds: 3000

  report:
    name: Open an issue for a failed run
    needs: batch
    if: ${{ failure() && github.event_name == 'schedule' && github.repository == 'graphviz-pure/graphviz-pure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # list this run's artifacts, to tell a crash from a broken run
      issues: write # open the issue that reports the failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ClusterFuzzLite uploads each target's crashes as cifuzz-crashes-<target>; without one,
      # the build, the action or the runner failed.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          crashes=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[].name | select(startswith("cifuzz-crashes-"))] | join(", ")')
          if [ -n "$crashes" ]; then
            scripts/ci-report-failure.sh "Fuzzing finds a crash on master" bug,crash \
              "The scheduled fuzz run at $COMMIT crashed: $RUN_URL. Minimised reproducers: $crashes."
          else
            scripts/ci-report-failure.sh "Fuzzing workflow fails on master" bug \
              "The scheduled fuzz run at $COMMIT failed without a crash (build, action or runner): $RUN_URL."
          fi
