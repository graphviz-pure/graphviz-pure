name: Fuzzing

# Coverage-guided fuzzing of the cargo-fuzz targets in fuzz/ with ClusterFuzzLite
# (.clusterfuzzlite/): panics, hangs and running out of memory on crafted DOT. No C oracle; the
# differential fuzzer against C Graphviz is separate (docs/porting/fuzzing.md).
#
# Fuzzing runs weekly, on a schedule, and before every release. The schedule keeps the corpus
# alive (D7 in docs/roadmap/1.0.md): the corpus is an artifact of this workflow, kept for 90
# days, so a gap of more than 90 days between releases loses it. release.yml calls this workflow
# on the base commit (master at dispatch), and that call stays the release's gate; a person can
# also dispatch it. It does not run on pull requests: a run takes over an hour, and the tests,
# the C differential corpora and the compiler already gate every change, so fuzzing each pull
# request (25 minutes a push, one crash in 141 runs) only slowed the agents fixing bugs.
#
# - A run fuzzes every target from the corpus of the earlier runs (kept as this workflow's
#   artifacts, with the crashes and the builds), then prunes the corpus. The weekly run uploads
#   the corpus again, so its artifacts never expire.
# - A run whose inputs an earlier run already fuzzed is skipped. The inputs are what the fuzz
#   targets are built from and seeded with (scripts/fuzz-inputs-key.sh): the crates' code, the
#   fuzz workspace and the test graphs, not the version, docs, scripts or other tests. A run that
#   passes uploads a `fuzzed-<key>` marker, and the `inputs` job looks for one, so dispatching
#   again after a changelog-only push takes a minute. Dispatch with `force` to fuzz anyway. The
#   weekly run always fuzzes: a skipped run saves no corpus, and the corpus would expire.
# - A crash fails the run. The minimised reproducer is the run's cifuzz-crashes-<target>
#   artifact. The release workflow does not open an issue for it; the weekly run, which nobody
#   waits for, opens one (the `report` job).

on:
  schedule:
    # Weekly, on Monday (D7). Not on the hour: GitHub delays the busiest times.
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Fuzz even if these inputs were already fuzzed
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Commit to fuzz. Empty fuzzes the workflow's own commit.
        type: string
        required: false
        default: ""
      force:
        description: Fuzz even if these inputs were already fuzzed
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Every run reads and writes the one corpus, so runs should never overlap: a run that wrote its
# corpus while another pruned would undo the pruning. They can: in a called workflow
# ${{ github.workflow }} is the caller's name, so the release's run and this workflow's own runs
# are in different groups (#559).
concurrency:
  group: ${{ github.workflow }}-corpus
  cancel-in-progress: false

jobs:
  inputs:
    name: Were these inputs fuzzed?
    if: github.repository == 'graphviz-pure/graphviz-pure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the markers of earlier runs
    outputs:
      key: ${{ steps.key.outputs.key }}
      fuzzed: ${{ steps.key.outputs.fuzzed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # release.yml passes the base commit. The fuzzed-inputs key ignores the version, so a
      # release whose code is unchanged reuses the marker. A dispatch with no ref fuzzes this run's commit.
      - name: Check out the commit to fuzz
        if: inputs.ref != '' && inputs.ref != null
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a 40-character commit sha"; exit 1; }
          git fetch --no-tags --depth=1 origin "$REF"
          git checkout --detach "$REF"
      # Only markers from runs of this repository count. Artifacts expire after 90 days, after
      # which the same inputs are fuzzed again.
      - name: Look for a run that fuzzed the same inputs
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          # The weekly run always fuzzes: a skipped run saves no corpus, and the corpus would
          # expire. A dispatch (and the release's call, whose event is the dispatch) keeps the
          # marker cache, so the release's gate stays what it was.
          FORCE: ${{ inputs.force || github.event_name == 'schedule' }}
        run: |
          key=$(scripts/fuzz-inputs-key.sh)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          run=$(gh api "repos/$GH_REPO/actions/artifacts?name=fuzzed-$key&per_page=100" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == $REPO_ID)]
                  | first | .workflow_run.id // empty")
          if [ -n "$run" ] && [ "$FORCE" != true ]; then
            echo "Inputs $key were fuzzed by run $run: skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "fuzzed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fuzzing inputs $key${run:+ again (force)}." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "fuzzed=false" >> "$GITHUB_OUTPUT"
          fi

  batch:
    name: Batch fuzzing and corpus pruning
    needs: inputs
    if: needs.inputs.outputs.fuzzed != 'true'
    runs-on: ubuntu-24.04
    # About 15 minutes to build, 60 to fuzz and up to 100 to prune.
    timeout-minutes: 200
    permissions:
      contents: read
      actions: read # the corpus kept by earlier runs
    steps:
      - name: Build the fuzz targets
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        env:
          # ClusterFuzzLite clones GITHUB_SHA rather than using the checkout above.
          GITHUB_SHA: ${{ inputs.ref || github.sha }}
        with:
          language: rust
          github-token: ${{ github.token }}
          sanitizer: address
      - name: Fuzz every target (6 min each)
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        env:
          GITHUB_SHA: ${{ inputs.ref || github.sha }}
        with:
          github-token: ${{ github.token }}
          mode: batch
          sanitizer: address
          fuzz-seconds: 3600
          minimize-crashes: true
      # Batch runs only add to the corpus; pruning drops the inputs that add no coverage.
      # ClusterFuzzLite splits fuzz-seconds across the targets and gives each one's corpus merge
      # that long: at 600 (60 s each), the merge of render_twopi's corpus after a batch run timed
      # out (#439). Most merges take far less, and a target that finishes early leaves its time to
      # the others.
      # A merge that times out says nothing about the code under test (#439, #499): it doesn't fail
      # the run, so a release's fuzzing gate is the fuzz step alone. The inputs are recorded as
      # fuzzed only when pruning passed too, so the next run prunes again.
      - name: Prune the corpus (up to 10 min each)
        id: prune
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        env:
          GITHUB_SHA: ${{ inputs.ref || github.sha }}
        with:
          github-token: ${{ github.token }}
          mode: prune
          sanitizer: address
          fuzz-seconds: 6000
      - name: Warn that pruning failed
        if: steps.prune.outcome == 'failure'
        run: |
          echo "::warning::Pruning the corpus failed (see the step above); the corpus is not pruned and these inputs will be fuzzed again (#499)."
          echo "Pruning the corpus failed; fuzzing passed. The corpus is not pruned (#499)." >> "$GITHUB_STEP_SUMMARY"
      # The marker the inputs job looks for, uploaded only when fuzzing and pruning both passed.
      - name: Record the inputs as fuzzed
        if: success() && steps.prune.outcome == 'success'
        env:
          KEY: ${{ needs.inputs.outputs.key }}
          COMMIT: ${{ inputs.ref || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/marker"
          echo "fuzzed $COMMIT, inputs $KEY" > "$RUNNER_TEMP/marker/fuzzed.txt"
      - if: success() && steps.prune.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzzed-${{ needs.inputs.outputs.key }}
          path: ${{ runner.temp }}/marker/fuzzed.txt
          retention-days: 90

  # Nobody waits for a weekly run, so a crash (or a run that broke before it could fuzz) opens an
  # issue, or comments on the one still open. A release's run opens no issue: its crash fails the
  # release, and the release driver files it.
  report:
    name: Open an issue for a failed weekly run
    needs: [inputs, batch]
    if: ${{ failure() && github.event_name == 'schedule' && github.repository == 'graphviz-pure/graphviz-pure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # list this run's artifacts, to tell a crash from a broken run
      issues: write # open the issue that reports the failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ClusterFuzzLite uploads each target's crashes as cifuzz-crashes-<target>; without one,
      # the build, the action or the runner failed.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A listing that fails (a token without actions: read, an API error) leaves the
          # crashes unknown: fall back to the "without a crash" issue rather than failing this
          # job, which would file nothing at all.
          crashes=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[].name | select(startswith("cifuzz-crashes-"))] | join(", ")') || crashes=""
          if [ -n "$crashes" ]; then
            scripts/ci-report-failure.sh "Fuzzing finds a crash on master" crash,fuzz \
              "The weekly fuzz run at $COMMIT crashed: $RUN_URL. Minimised reproducers: $crashes."
          else
            scripts/ci-report-failure.sh "Fuzzing workflow fails on master" fuzz \
              "The weekly fuzz run at $COMMIT failed without a crash (build, action or runner): $RUN_URL."
          fi
