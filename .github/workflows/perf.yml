name: Perf ratchet

# The perf ratchet (docs/perf/ratchet.md): scripts/bench/ratchet.py counts, for every case of
# scripts/bench/sets/quick.tsv and sets/ratchet-extra.tsv, the instructions under Callgrind and the
# heap allocations and peak heap under dhat, and fails when a case has more allocations than
# scripts/bench/ratchet-baseline.json, more than 2% more instructions or more than 5% more peak
# heap. Wall time is never checked. The report, with the improvements, is the job summary; the
# measurement is the `perf-ratchet` artifact, from which `ratchet.py --update --from` rewrites
# the baseline.
#
# A pull request with the `perf-regression-accepted` label, and a justification in its
# description, passes with its regressions reported; adding or removing the label runs the job
# again.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore: ["docs/**", "site/**", "**.md"]
  push:
    branches: ["master"]
    paths-ignore: ["docs/**", "site/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; master runs all complete. Adding
# or removing another label starts a run that skips its job: it gets a group of its own, so it
# does not cancel the measurement in progress.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    && github.event.label.name != 'perf-regression-accepted'
    && format('label-{0}', github.run_id) || 'measure' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned like release.yml's: a new Rust release changes the counts. Bump both together and
  # refresh the baseline (ratchet.py --update) in the same pull request.
  RUST_VERSION: "1.99.1"

jobs:
  ratchet:
    name: Instructions, allocations and peak heap
    # Another label being added or removed changes nothing here.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'perf-regression-accepted'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_VERSION }} (musl and wasm32 targets)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target x86_64-unknown-linux-musl --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Valgrind
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends valgrind
          valgrind --version
      # ratchet.py builds with the release profile pinned (its PROFILE), into target/ratchet.
      - name: Measure and check
        env:
          ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-regression-accepted') }}
        run: |
          accept=()
          if [ "$ACCEPTED" = true ]; then accept=(--accept); fi
          python3 -I scripts/bench/ratchet.py --wasm --jobs 4 "${accept[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-ratchet
          path: target/ratchet/results.json
          if-no-files-found: ignore
          retention-days: 90
