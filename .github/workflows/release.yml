name: Release

# Builds a release from master's head and, unless dry_run is set, publishes it after one
# approval of the `release` environment. Anyone who can dispatch a workflow can start it.
# Only the environment's reviewer can approve it, and that one approval starts every
# publishing job.
#
#     gh workflow run release.yml [-f version=X.Y.Z] [-f intro=...] [-f dry_run=true]
#
# Security model:
# - One release run at a time (concurrency group `release`). A real release has to be
#   dispatched from master; prepare refuses any other ref. dry_run may run from any ref and
#   publishes nothing: its publishing jobs are skipped and the environment is never requested.
# - prepare, with a read-only token and no environment, checks master's head and commits the
#   changelog and the version bump locally, as github-actions[bot]. That commit is not on a
#   branch yet. Later jobs check it out from a git bundle. The checks are the ones in
#   scripts/release-check.sh: no open priority:p1 or priority:p2 issue, no open
#   "Cross-platform fails on master", ci.yml and cross-platform.yml succeeded on that commit,
#   every pull request since the last tag has a changelog entry, the version is the one the
#   breaking labels ask for and is not tagged yet, and the e2e fidelity count is not lower.
# - Fuzzing (fuzz.yml, on that same base commit) runs beside the builds. Its fuzzed-inputs
#   cache makes it a cache lookup when the code has not changed. It has to pass before the
#   publishing jobs can ask for approval.
# - Everything is built on GitHub-hosted runners from the release commit, with no caches (a
#   poisoned cache cannot reach a release), `cargo build --locked` and a pinned Rust toolchain.
# - Every binary and the npm package, the container image on both platforms, and the Windows
#   zip installed through Scoop must reproduce the gallery samples byte for byte before
#   anything is published (scripts/release-smoke.*).
# - Every artifact gets a signed build-provenance attestation (Sigstore), verifiable with
#   `gh attestation verify FILE --repo graphviz-pure/graphviz-pure`. The certificate's source
#   ref is this run's ref. A real release is dispatched from master, so that ref is
#   refs/heads/master, not the tag: the tag does not exist until the approval. Releases
#   through 0.2.3 were attested for the tag.
# - Publishing happens only in jobs bound to the `release` environment, which needs a
#   reviewer's approval. The seven publishing jobs wait on the same jobs, so they wait for
#   the environment together and one approval starts them all (see the crates-io job). The
#   trusted publishers of crates.io, npm and PyPI are bound to this environment. crates.io,
#   npm, PyPI and JSR are published with tokenless OIDC (trusted publishing; JSR's GitHub
#   Actions publishing): no registry token exists for them. npm is published with
#   `npm publish --provenance`, not staged. The container image goes to ghcr.io with the
#   job's own GITHUB_TOKEN (packages: write in that job only). Every token these jobs hold
#   lives for one job, except one: Wasmer has no trusted publishing, so the wasmer job
#   publishes with a Wasmer API token, a secret of the `release` environment that only that
#   job reads.
# - github-release, after the same approval, mints a GitHub App token from the environment
#   secrets RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY, pushes the release commit to master
#   (fast-forward, or a merge commit if master moved; a conflict fails before anything is
#   created), tags that commit (annotated, unsigned) and publishes the GitHub release. It
#   then dispatches update.yml in the Homebrew tap and the Scoop bucket. The App token lives
#   for that job. This repository's GITHUB_TOKEN never writes contents.
# - The verify job, with no environment, checks what the publishing jobs published
#   (scripts/release-verify.sh --ci: every channel but the tap and bucket, which were
#   dispatched rather than waited on) and closes a milestone titled X.Y.Z if one is open.
#   It opens no issue and writes no comment.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (empty = the version the breaking labels ask for)
        type: string
        required: false
        default: ""
      intro:
        description: Changelog intro (empty = a line counted from the entries)
        type: string
        required: false
        default: ""
      dry_run:
        description: Build, fuzz and attest only; do not publish
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The release toolchain, pinned: a new Rust release cannot change a release build silently.
  RUST_VERSION: "1.99.1"
  IMAGE: ghcr.io/graphviz-pure/graphviz-pure
  # Deno publishes to JSR. The SHA-256 of deno-x86_64-unknown-linux-gnu.zip, as in that
  # release's .sha256sum file.
  DENO_VERSION: "2.9.7"
  DENO_SHA256: c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490
  # Scoop v0.6.0, for the Scoop manifest smoke test.
  SCOOP_COMMIT: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f
  # Wasmer runs the WASI build's smoke test and publishes it. Wasmer publishes no checksums or
  # attestations: this is the SHA-256 of that release's wasmer-linux-amd64.tar.gz, as downloaded
  # when it was pinned.
  WASMER_VERSION: "7.5.0"
  WASMER_SHA256: 23f99818deaad93859f8bb8292af81f0c39f25aea19eaccfb72fc7c9e8a3fae9
  # uv publishes the wheels to PyPI. The SHA-256 of uv-x86_64-unknown-linux-gnu.tar.gz, as in
  # that release's .sha256 file.
  UV_VERSION: "0.13.5"
  UV_SHA256: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
  # cargo-binstall installs the published crate's release archives in the verify job (a dry run).
  # The SHA-256 of cargo-binstall-x86_64-unknown-linux-musl.tgz, as GitHub reports that asset's
  # digest.
  BINSTALL_VERSION: "1.26.1"
  BINSTALL_SHA256: 43d379fef8cb450961a14ff113e7bce7b5e1e52db709c776d186f928d8a20a40

jobs:
  prepare:
    name: Prepare the release commit
    if: github.repository == 'graphviz-pure/graphviz-pure'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # changelog entries live in pull request bodies
      issues: read # priority labels and the cross-platform issue
      actions: read # ci.yml and cross-platform.yml on master's head
    outputs:
      version: ${{ steps.commit.outputs.version }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
      base_sha: ${{ steps.commit.outputs.base_sha }}
    steps:
      # The workflow ref, not the release commit: the scripts this job runs landed with the
      # workflow, and the tree they release is master's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A real release is dispatched from master
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if [ "$DRY_RUN" != true ] && [ "$REF" != refs/heads/master ]; then
            echo "::error::A real release is dispatched from master (this run is $REF). Pass dry_run to build without publishing."
            exit 1
          fi
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: Readiness, changelog and release commit
        id: commit
        env:
          VERSION_INPUT: ${{ inputs.version }}
          INTRO_INPUT: ${{ inputs.intro }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-check.sh --summary "$GITHUB_STEP_SUMMARY" \
            --meta "$RUNNER_TEMP/release-meta.json" --section "$RUNNER_TEMP/release-section.md"
          scripts/release-commit.sh --meta "$RUNNER_TEMP/release-meta.json" \
            --section "$RUNNER_TEMP/release-section.md" --bundle release-commit/release.bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-commit
          path: release-commit/release.bundle
          if-no-files-found: error
          retention-days: 5

  # Skipped on a dry run. Every publishing job needs this one and checks
  # `needs.publish.result == 'success'`, so a dry run never requests the release environment.
  # Those jobs still wait until fuzzing finishes before they are marked skipped. On a real run
  # this job succeeds as soon as prepare has, and the publishing jobs still wait for the builds
  # and for fuzzing, then for the environment, together.
  publish:
    name: Publishing is part of this run
    needs: prepare
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The publishing jobs still wait for the builds, fuzzing and the release environment
        run: echo "dry_run is false; the publishing jobs will wait together for the release environment."

  fuzz:
    name: Fuzz
    needs: prepare
    permissions:
      contents: read
      actions: read # fuzz.yml reads the fuzzed-inputs markers of earlier runs
    uses: $/.github/workflows/fuzz.yml
    with:
      ref: ${{ needs.prepare.outputs.base_sha }}

  check:
    name: Check the release commit
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      release_sha: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.prepare.outputs.base_sha }}
          release-sha: ${{ needs.prepare.outputs.release_sha }}
      - name: The commit carries the prepared version
        id: v
        env:
          EXPECTED: ${{ needs.prepare.outputs.version }}
        run: |
          version=$(awk -F'"' '/^\[workspace.package\]/{p=1} p && /^version =/{print $2; exit}' Cargo.toml)
          test -n "$version"
          # SemVer build metadata (0.1.0+x) cannot be a container image tag.
          case "$version" in *+*) echo "::error::version $version has build metadata (+...)"; exit 1 ;; esac
          test "$version" = "$EXPECTED" || { echo "::error::Cargo.toml says $version but prepare produced $EXPECTED"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # PyPI takes X.Y.Z and X.Y.Z-alpha.N, -beta.N, -rc.N only (scripts/release-wheel.py).
      - name: The version has a PEP 440 form
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: python3 scripts/release-wheel.py --pep440 "$VERSION"
      # What the crates-io job will publish (it runs the same script), so a dry run exercises it.
      - name: Crates to publish
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 scripts/crates-to-publish.py "$RUNNER_TEMP/metadata.json" "$VERSION"
      # The crates the crates-io job publishes carry their licence files (also checked in CI),
      # packaged by the same cargo as the crates-io job's.
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: The crates carry the licence files
        run: scripts/check-crate-notices.sh

  binaries:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target is a default build: one math library everywhere, so every binary writes
          # the same bytes (the smoke test below checks the gallery's).
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, runner: windows-2025 }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
      - name: Install Rust ${{ env.RUST_VERSION }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          # Windows: link the C runtime statically, so the binary needs no VC++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target "$TARGET" -p graphviz-pure-cli
      - name: Smoke test (byte-identical gallery samples)
        env:
          TARGET: ${{ matrix.target }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          exe=target/$TARGET/release/graphviz-pure
          case "$TARGET" in *windows*) exe=$exe.exe ;; esac
          "$PYTHON" scripts/release-smoke.py "$exe"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          "$PYTHON" scripts/release-package.py "$TARGET" "$VERSION" dist
          "$PYTHON" scripts/check-package-notices.py dist/graphviz-pure-*
      # The PyPI wheel: the archive's binary in a wheel's scripts directory, installed with pip
      # into a fresh environment on this runner, which must then pass the smoke test and hold
      # the same bytes. Not a release file: the wheels go only to PyPI.
      - name: Wheel
        env:
          TARGET: ${{ matrix.target }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          "$PYTHON" scripts/release-wheel.py dist/graphviz-pure-*-"$TARGET".* wheel
          # A relative path, as for the binary above (on Windows, RUNNER_TEMP is a Windows path).
          "$PYTHON" -m venv wheel-venv
          case "$TARGET" in
            *windows*) bin=wheel-venv/Scripts exe=graphviz-pure.exe ;;
            *) bin=wheel-venv/bin exe=graphviz-pure ;;
          esac
          "$bin/python" -m pip install --quiet --no-index --no-deps wheel/*.whl
          cmp "$bin/$exe" "target/$TARGET/release/$exe"
          "$PYTHON" scripts/release-smoke.py "$bin/$exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: wheel/
          if-no-files-found: error

  npm-package:
    name: Build the npm package
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no caches in a release
      # wasm-bindgen-cli is built from crates.io at exactly the version in Cargo.lock. No
      # wasm-opt: Ubuntu's binaryen (108) breaks the module's function table, and the build
      # already optimizes for size (opt-level z, fat LTO).
      - name: Install wasm-bindgen-cli
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install --locked wasm-bindgen-cli --version "$v"
      - name: Build
        working-directory: web
        run: npm run build:wasm
      - name: Smoke test (byte-identical gallery samples)
        run: node scripts/release-smoke-wasm.mjs
      - name: Check the package versions (npm and JSR)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          test "$(node -p "require('./web/package.json').version")" = "$VERSION"
          test "$(node -p "require('./web/jsr.json').version")" = "$VERSION"
      # The tarball also carries jsr.json, so the jsr job publishes exactly its files, and the
      # licence files, which package.json's prepack script copies in: the module includes the
      # CORE-MATH pow port (MIT, see NOTICE) and the crates in THIRD-PARTY-LICENSES.md, not the fonts.
      - name: Pack
        working-directory: web
        run: mkdir -p ../dist && npm pack --pack-destination ../dist
      - name: The package carries the licence files
        run: python3 scripts/check-package-notices.py dist/*.tgz
      - name: Install Deno ${{ env.DENO_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --output deno.zip \
            "https://github.com/denoland/deno/releases/download/v$DENO_VERSION/deno-x86_64-unknown-linux-gnu.zip"
          echo "$DENO_SHA256  deno.zip" | sha256sum --check --strict
          unzip -q deno.zip deno
      # What the jsr job will publish, checked now so a dry run exercises it (no token here).
      - name: JSR publish dry run
        run: |
          mkdir "$RUNNER_TEMP/jsr"
          tar -xzf dist/*.tgz -C "$RUNNER_TEMP/jsr"
          cd "$RUNNER_TEMP/jsr/package"
          "$RUNNER_TEMP/deno" publish --dry-run
      # The npm job's command, as a dry run (no token, so no provenance here). The ./ matters:
      # npm reads a bare dist/NAME.tgz as a GitHub repository shorthand, not a file.
      - name: npm publish dry run
        run: npm publish --dry-run --access public ./dist/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: dist/
          if-no-files-found: error

  # The WASI build (wasm32-wasip1), for Wasmer and other WebAssembly runtimes: a release archive
  # like the binaries', holding graphviz-pure.wasm, smoke-tested under the pinned Wasmer it is
  # published to. The Wasmer package the wasmer job publishes is built here from that archive,
  # so a dry run checks its manifest.
  wasi:
    name: Build wasm32-wasip1
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # -eo pipefail: the wasmer runs below are piped
    steps:
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-wasip1
          rustup default "$RUST_VERSION"
      - name: Build
        run: cargo build --release --locked --target wasm32-wasip1 -p graphviz-pure-cli
      - name: Install Wasmer ${{ env.WASMER_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --output wasmer.tar.gz \
            "https://github.com/wasmerio/wasmer/releases/download/v$WASMER_VERSION/wasmer-linux-amd64.tar.gz"
          echo "$WASMER_SHA256  wasmer.tar.gz" | sha256sum --check --strict
          mkdir wasmer && tar -xzf wasmer.tar.gz -C wasmer
          echo "WASMER_DIR=$RUNNER_TEMP/wasmer-home" >> "$GITHUB_ENV"
      # The checkout is mapped into the sandbox at its own path, so the samples' paths work there.
      - name: Smoke test (version, byte-identical gallery samples)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/graphviz-pure" <<EOF
          #!/bin/sh
          exec "$RUNNER_TEMP/wasmer/bin/wasmer" run --volume "$PWD:$PWD" "$PWD/target/wasm32-wasip1/release/graphviz-pure.wasm" -- "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/graphviz-pure"
          "$RUNNER_TEMP/graphviz-pure" -V 2>&1 | grep -F "graphviz-pure version $VERSION ("
          python3 scripts/release-smoke.py "$RUNNER_TEMP/graphviz-pure"
      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          python3 scripts/release-package.py wasm32-wasip1 "$VERSION" dist
          python3 scripts/check-package-notices.py dist/graphviz-pure-*
      # What the wasmer job will publish, built and run from the archive (no token here).
      - name: Wasmer package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          scripts/wasmer-package.sh "dist/graphviz-pure-$VERSION-wasm32-wasip1.tar.gz" "$RUNNER_TEMP/wasmer-package"
          "$RUNNER_TEMP/wasmer/bin/wasmer" package build "$RUNNER_TEMP/wasmer-package" -o "$RUNNER_TEMP/graphviz-pure.webc"
          echo 'digraph { a -> b }' | "$RUNNER_TEMP/wasmer/bin/wasmer" run "$RUNNER_TEMP/graphviz-pure.webc" -- -Tcanon | grep -qF 'a -> b;'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-wasm32-wasip1
          path: dist/
          if-no-files-found: error

  # The container image is assembled from the two musl archives above (no second compile) with
  # the docker and buildx already on the runner: the organization allows no docker/* actions.
  image:
    name: Build the container image
    needs: [check, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*-unknown-linux-musl
          path: dist
          merge-multiple: true
      - name: Use the containerd image store (multi-platform builds)
        # Merged into the runner's daemon.json, which holds settings of its own.
        run: |
          sudo mkdir -p /etc/docker
          test -s /etc/docker/daemon.json || echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo python3 - <<'EOF'
          import json
          p = "/etc/docker/daemon.json"
          c = json.load(open(p))
          c.setdefault("features", {})["containerd-snapshotter"] = True
          json.dump(c, open(p, "w"))
          EOF
          sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}' | grep -q io.containerd.snapshotter
      - name: Build
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          scripts/release-image.sh "$VERSION" dist image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image/
          if-no-files-found: error

  # The image must reproduce the gallery samples byte for byte on each platform, like the
  # binaries: release-smoke.py runs it through a wrapper that mounts the checkout read-only.
  image-smoke:
    name: Smoke test the image (${{ matrix.platform }})
    needs: [check, image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: image
      - name: Use the containerd image store (multi-platform images)
        # As in the image job.
        run: |
          sudo mkdir -p /etc/docker
          test -s /etc/docker/daemon.json || echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo python3 - <<'EOF'
          import json
          p = "/etc/docker/daemon.json"
          c = json.load(open(p))
          c.setdefault("features", {})["containerd-snapshotter"] = True
          json.dump(c, open(p, "w"))
          EOF
          sudo systemctl restart docker
          docker info -f '{{.DriverStatus}}' | grep -q io.containerd.snapshotter
      # With the containerd store an image's ID is the digest of its index: the loaded image must
      # be the one the image job built, and `--pull never` keeps docker from fetching another.
      - name: Load
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          docker load --input image/graphviz-pure-image.tar
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE:$VERSION")" = "$(cat image/graphviz-pure-image.digest)"
      - name: Smoke test (version, byte-identical gallery samples)
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/graphviz-pure" <<EOF
          #!/bin/sh
          exec docker run --rm --pull never --network none --platform $PLATFORM -v "$PWD:$PWD:ro" $IMAGE:$VERSION "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/graphviz-pure"
          "$RUNNER_TEMP/graphviz-pure" -V 2>&1 | grep -F "graphviz-pure version $VERSION ("
          python3 scripts/release-smoke.py "$RUNNER_TEMP/graphviz-pure"

  # Installs the Windows zips with Scoop, from a manifest written like the one
  # graphviz-pure/scoop-bucket's scripts/update.sh writes (same fields, both architectures,
  # extract_dir and bin) but pointing at the local zips, then runs the smoke test through Scoop's
  # shim, on x86-64 and on arm64. Scoop's installer (get.scoop.sh) always installs Scoop's master
  # branch, so Scoop is set up the way the installer does it (its repository in
  # apps\scoop\current) from a pinned commit instead. The Main bucket is not needed for a
  # manifest file and is not installed.
  scoop-smoke:
    name: Smoke test the Scoop manifest (${{ matrix.arch }})
    needs: [check, binaries]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # machine: the PE header's machine field of the exe Scoop must install.
          - { arch: 64bit, runner: windows-2025, machine: "0x8664" }
          - { arch: arm64, runner: windows-11-arm, machine: "0xaa64" }
    steps:
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*-pc-windows-msvc
          path: dist
          merge-multiple: true
      - name: Install Scoop at ${{ env.SCOOP_COMMIT }}
        shell: pwsh
        run: |
          $scoop = "$env:RUNNER_TEMP\scoop"
          $app = "$scoop\apps\scoop\current"
          git init -q $app
          git -C $app fetch -q --depth 1 https://github.com/ScoopInstaller/Scoop.git $env:SCOOP_COMMIT
          git -C $app checkout -q FETCH_HEAD
          if ((git -C $app rev-parse HEAD) -ne $env:SCOOP_COMMIT) { throw "Scoop is not at $env:SCOOP_COMMIT" }
          # The directories the installer creates, which Scoop's commands expect to exist.
          New-Item -ItemType Directory "$scoop\shims", "$scoop\buckets" | Out-Null
          "SCOOP=$scoop" >> $env:GITHUB_ENV
      - name: scoop install
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          function Entry($target) {
            $name = "graphviz-pure-$env:VERSION-$target-pc-windows-msvc"
            $zip = (Resolve-Path "dist\$name.zip").Path
            [ordered]@{
              url = 'file:///' + $zip.Replace('\', '/')
              hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
              extract_dir = $name
            }
          }
          $manifest = [ordered]@{
            version = $env:VERSION
            description = 'Pure-Rust port of Graphviz 16.1.0, same output on every platform (not affiliated with Graphviz)'
            homepage = 'https://graphviz-pure.github.io/'
            license = 'EPL-2.0'
            architecture = [ordered]@{
              '64bit' = Entry 'x86_64'
              arm64 = Entry 'aarch64'
            }
            bin = 'graphviz-pure.exe'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "$env:RUNNER_TEMP\graphviz-pure.json"
          Get-Content "$env:RUNNER_TEMP\graphviz-pure.json"
          & "$env:SCOOP\apps\scoop\current\bin\scoop.ps1" install --no-update-scoop --arch $env:ARCH "$env:RUNNER_TEMP\graphviz-pure.json"
          if (!(Test-Path "$env:SCOOP\shims\graphviz-pure.exe")) { throw 'scoop install did not create the graphviz-pure shim' }
      # The arm64 runner would also run an x86-64 exe (emulated), so check which one was installed.
      - name: Smoke test (architecture, version, byte-identical gallery samples)
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          MACHINE: ${{ matrix.machine }}
        run: |
          exe="$(cygpath -u "$SCOOP")/apps/graphviz-pure/current/graphviz-pure.exe"
          python -c 'import struct, sys; d = open(sys.argv[1], "rb").read(4096); m = struct.unpack_from("<H", d, struct.unpack_from("<I", d, 0x3C)[0] + 4)[0]; print(f"machine {m:#06x}"); sys.exit(m != int(sys.argv[2], 16))' "$exe" "$MACHINE"
          shim="$(cygpath -u "$SCOOP")/shims/graphviz-pure.exe"
          "$shim" -V 2>&1 | grep -F "graphviz-pure version $VERSION ("
          python scripts/release-smoke.py "$shim"

  attest:
    name: Checksums and provenance
    needs: [check, binaries, npm-package, wasi]
    # A fixed image, so the Python that runs scripts/check-binstall.py has tomllib (3.12 here).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation in this repository
    steps:
      # By name and pattern: the image artifact is uploaded meanwhile and is not a release file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # The published crate's metadata must lead cargo-binstall to every archive (the checkout
      # only provides the script and the manifest; nothing from it is attested).
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
          path: src
      - name: cargo-binstall finds every archive
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: python3 src/scripts/check-binstall.py src/crates/graphviz-pure-cli/Cargo.toml dist "$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
      # The PyPI wheels, attested too but kept out of the GitHub release (installers that pick a
      # release asset by platform name would see two candidates).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
      - name: Six wheels
        run: ls wheels && test "$(find wheels -name '*.whl' | wc -l)" = 6
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: wheels/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi
          path: wheels/
          if-no-files-found: error

  github-release:
    name: Publish the GitHub release
    if: needs.publish.result == 'success'
    # Every smoke test and fuzzing must pass before anything is published. This `needs:` list
    # is identical on all seven publishing jobs: GitHub asks for one approval per environment
    # for the jobs waiting on it at that moment, so a job that waited on fewer jobs would ask
    # for a second approval. `publish` is skipped on a dry run, which skips these jobs before
    # they can request the environment.
    needs: [publish, check, attest, image-smoke, scoop-smoke, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read # the App token below does the writes; this token only downloads the artifact
    steps:
      # Full history: the ship script merges onto master if it has moved since prepare.
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
          fetch-depth: "0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            graphviz-pure
            homebrew-tap
            scoop-bucket
          permission-contents: write
          permission-actions: write
      - name: Push, tag, publish and dispatch the tap and bucket
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.check.outputs.version }}
          BASE_SHA: ${{ needs.check.outputs.base_sha }}
          RELEASE_SHA: ${{ needs.check.outputs.release_sha }}
        run: scripts/release-ship.sh dist

  # The publishing jobs need the same jobs as github-release, not github-release itself: GitHub
  # asks for one approval per environment for the jobs waiting on it at that moment, so jobs that
  # waited on github-release would wait for a second approval. The trade-off: the registries no
  # longer wait for the GitHub release to exist, and a failed github-release job no longer holds
  # them back (each job is re-runnable on its own, see docs/releasing.md). Keep the seven `needs:`
  # lists identical, or the approval splits in two again. The tap and bucket dispatches stay
  # inside github-release for the same reason: a later job would ask for a second approval.
  crates-io:
    name: Publish to crates.io
    if: needs.publish.result == 'success'
    needs: [publish, check, attest, image-smoke, scoop-smoke, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing: exchange the OIDC token for a short-lived crates.io token
    steps:
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      # Re-runnable: the crates whose version is already on crates.io are left out, so "Re-run
      # failed jobs" finishes a partial publish. The crates are the workspace's publishable ones
      # (cargo metadata, read locally); crates.io's API says which versions exist.
      - name: Crates still to publish
        id: todo
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 scripts/crates-to-publish.py "$RUNNER_TEMP/metadata.json" "$VERSION" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.todo.outputs.remaining != '0'
        id: auth
      # Publishes the remaining crates in dependency order (the others have publish = false).
      # EXCLUDE holds zero or more `--exclude NAME` arguments.
      - name: cargo publish
        if: steps.todo.outputs.remaining != '0'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          EXCLUDE: ${{ steps.todo.outputs.exclude }}
        run: |
          read -ra exclude <<< "$EXCLUDE"
          cargo publish --locked --workspace "${exclude[@]}"

  npm:
    name: Publish to npm
    if: needs.publish.result == 'success'
    needs: [publish, check, attest, image-smoke, scoop-smoke, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing; npm adds provenance from the same token
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm 11, which supports trusted publishing
          package-manager-cache: false # no caches in a release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist
      # The tarball the attest job signed is the one published. Provenance is signed from this
      # job's OIDC token. The trusted publisher has to allow `npm publish` (docs/releasing.md).
      - name: npm publish
        run: npm publish --provenance --access public ./dist/*.tgz

  # The attested npm tarball, published to JSR as it is (it carries jsr.json, README.md, LICENSE,
  # NOTICE and THIRD-PARTY-LICENSES.md) by a pinned, checksum-verified Deno: nothing in this job
  # is resolved at run time.
  # JSR has no staging, so the `release` environment's approval is the only gate.
  jsr:
    name: Publish to JSR
    if: needs.publish.result == 'success'
    needs: [publish, check, attest, image-smoke, scoop-smoke, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # JSR's GitHub Actions OIDC publishing; deno publish adds provenance from it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist
      - name: Install Deno ${{ env.DENO_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --output deno.zip \
            "https://github.com/denoland/deno/releases/download/v$DENO_VERSION/deno-x86_64-unknown-linux-gnu.zip"
          echo "$DENO_SHA256  deno.zip" | sha256sum --check --strict
          unzip -q deno.zip deno
      - name: Unpack, and check jsr.json against the version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/jsr"
          tar -xzf dist/*.tgz -C "$RUNNER_TEMP/jsr"
          v=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/jsr/package/jsr.json")
          test "$v" = "$VERSION" || { echo "::error::jsr.json says $v but the release is $VERSION"; exit 1; }
      - name: deno publish
        working-directory: ${{ runner.temp }}/jsr/package
        run: '"$RUNNER_TEMP/deno" publish'

  # The attested wasm32-wasip1 archive, published to the Wasmer registry as
  # graphviz-pure/graphviz-pure by the pinned, checksum-verified Wasmer. Wasmer has no trusted
  # publishing: WASMER_TOKEN is an API token of the namespace's owner, a secret of the `release`
  # environment, so no other job and no run without the approval can read it, and only the
  # publish step holds it. Wasmer has no staging: the version is live when the job finishes.
  # The job publishes nothing, and succeeds with `published=false` so that the verify job leaves
  # the channel out, when the secret is not set up yet (docs/releasing.md) and for a pre-release
  # (the registry would show it as the latest version).
  wasmer:
    name: Publish to Wasmer
    if: needs.publish.result == 'success'
    needs: [publish, check, attest, image-smoke, scoop-smoke, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash # -eo pipefail
    outputs:
      published: ${{ (steps.todo.outputs.present == 'true' || steps.publish.outcome == 'success') && 'true' || 'false' }}
    steps:
      - name: Is there anything to publish?
        id: todo
        env:
          VERSION: ${{ needs.check.outputs.version }}
          HAS_TOKEN: ${{ secrets.WASMER_TOKEN != '' }}
        run: |
          # shellcheck disable=SC2016 # $v is a GraphQL variable
          query='query($v: String) { getPackageVersion(name: "graphviz-pure/graphviz-pure", version: $v) { version } getPackage(name: "graphviz-pure/graphviz-pure") { name } }'
          answer=$(jq -nc --arg q "$query" --arg v "$VERSION" '{query: $q, variables: {v: $v}}' |
            curl -fsS -A "graphviz-pure release (https://github.com/$GITHUB_REPOSITORY)" -H 'content-type: application/json' \
              --data @- https://registry.wasmer.io/graphql)
          jq -e '.data != null and (.errors | length // 0) == 0' <<< "$answer" > /dev/null ||
            { echo "::error::the Wasmer registry did not answer: $answer"; exit 1; }
          if jq -e '.data.getPackageVersion != null' <<< "$answer" > /dev/null; then
            echo "graphviz-pure/graphviz-pure $VERSION is already in the registry"
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_TOKEN" != true ]; then
            # Not set up yet only while nothing was ever published; a secret lost later fails.
            jq -e '.data.getPackage == null' <<< "$answer" > /dev/null ||
              { echo "::error::graphviz-pure/graphviz-pure is in the registry but the release environment has no WASMER_TOKEN"; exit 1; }
            echo "::notice::Wasmer is not set up (no WASMER_TOKEN secret in the release environment, see docs/releasing.md): not published"
          elif [[ "$VERSION" == *-* ]]; then
            echo "::notice::$VERSION is a pre-release: not published to Wasmer"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.todo.outputs.publish == 'true'
        uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
      - if: steps.todo.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: The package, from the attested archive
        if: steps.todo.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          (cd dist && awk -v f="graphviz-pure-$VERSION-wasm32-wasip1.tar.gz" '$2 == f' SHA256SUMS | sha256sum --check --strict)
          scripts/wasmer-package.sh "dist/graphviz-pure-$VERSION-wasm32-wasip1.tar.gz" "$RUNNER_TEMP/wasmer-package"
      - name: Install Wasmer ${{ env.WASMER_VERSION }}
        if: steps.todo.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --output wasmer.tar.gz \
            "https://github.com/wasmerio/wasmer/releases/download/v$WASMER_VERSION/wasmer-linux-amd64.tar.gz"
          echo "$WASMER_SHA256  wasmer.tar.gz" | sha256sum --check --strict
          mkdir wasmer && tar -xzf wasmer.tar.gz -C wasmer
          echo "WASMER_DIR=$RUNNER_TEMP/wasmer-home" >> "$GITHUB_ENV"
      # Re-runnable: a version already in the registry is left as it is above (versions are
      # immutable there, and scripts/release-verify.sh checks that it holds the attested module).
      - name: wasmer publish
        id: publish
        if: steps.todo.outputs.publish == 'true'
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: '"$RUNNER_TEMP/wasmer/bin/wasmer" publish --non-interactive --wait=container "$RUNNER_TEMP/wasmer-package"'

  # The attested wheels, published to PyPI as graphviz-pure by a pinned, checksum-verified uv with
  # trusted publishing (OIDC; the PyPI publisher is bound to the `release` environment). PyPI has
  # no staging: the version is live when the job finishes. Re-runnable: a re-run uploads the same
  # files (this run's artifact), and --check-url makes uv skip the ones PyPI already has with the
  # same bytes (PyPI answers a re-upload with 400). Until a maintainer has
  # set up the trusted publisher (docs/releasing.md), PyPI answers the token exchange with
  # `invalid-publisher` and has no graphviz-pure project: the job then publishes nothing and
  # succeeds with `published=false`, and the verify job leaves the channel out. Any other
  # failure, and invalid-publisher once the project exists, fails the job.
  pypi:
    name: Publish to PyPI
    if: needs.publish.result == 'success'
    needs: [publish, check, attest, image-smoke, scoop-smoke, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing: exchange the OIDC token for a short-lived PyPI token
    defaults:
      run:
        shell: bash # -eo pipefail
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi
          path: wheels
      - name: Install uv ${{ env.UV_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --output uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  uv.tar.gz" | sha256sum --check --strict
          tar -xzf uv.tar.gz --strip-components 1 uv-x86_64-unknown-linux-gnu/uv
      # The exchange PyPI documents for trusted publishing, done here rather than inside uv so
      # that a publisher that is not set up yet is told apart from a failure. The short-lived
      # token stays in this step.
      - name: uv publish
        id: publish
        env:
          UV_NO_CACHE: "1"
          UV_NO_CONFIG: "1"
        run: |
          audience=$(curl -fsS https://pypi.org/_/oidc/audience | jq -r .audience)
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -er .value)
          echo "::add-mask::$oidc"
          answer=$(jq -nc --arg t "$oidc" '{token: $t}' |
            curl -sS -X POST -H 'content-type: application/json' --data @- https://pypi.org/_/oidc/mint-token)
          token=$(jq -r '.token // empty' <<< "$answer")
          if [ -z "$token" ]; then
            # invalid-publisher means "not set up yet" only while PyPI has no graphviz-pure project:
            # once it has, the publisher's claims no longer match (a renamed workflow or
            # environment), which must fail.
            if jq -e '[.errors[]?.code] == ["invalid-publisher"]' <<< "$answer" > /dev/null &&
              [ "$(curl -sS -o /dev/null -w '%{http_code}' https://pypi.org/pypi/graphviz-pure/json)" = 404 ]; then
              echo "::notice::PyPI's trusted publisher is not set up (see docs/releasing.md): not published"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::PyPI refused the token exchange: $(jq -c '.errors // .' <<< "$answer")"
            exit 1
          fi
          echo "::add-mask::$token"
          UV_PUBLISH_TOKEN=$token "$RUNNER_TEMP/uv" publish --check-url https://pypi.org/simple/ wheels/*.whl
          echo "published=true" >> "$GITHUB_OUTPUT"

  ghcr:
    name: Publish the container image
    if: needs.publish.result == 'success'
    needs: [publish, check, attest, image-smoke, scoop-smoke, fuzz]
    runs-on: ubuntu-24.04 # has skopeo
    timeout-minutes: 20
    environment: release
    permissions:
      packages: write # push to ghcr.io/graphviz-pure/graphviz-pure
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestation in this repository
      artifact-metadata: write # record where the attested image is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: image
      # skopeo copies the smoke-tested OCI layout as it is, so the tag gets the digest the image
      # job computed. Pushing it again (a re-run) changes nothing.
      - name: Push ${{ needs.check.outputs.version }}
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/auth.json"' EXIT
          digest=$(cat image/graphviz-pure-image.digest)
          printenv GH_TOKEN | skopeo login --authfile "$RUNNER_TEMP/auth.json" --username "$ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests --authfile "$RUNNER_TEMP/auth.json" --digestfile "$RUNNER_TEMP/pushed" \
            oci-archive:image/graphviz-pure-image.tar "docker://$IMAGE:$VERSION"
          test "$(cat "$RUNNER_TEMP/pushed")" = "$digest" || { echo "::error::$IMAGE:$VERSION was pushed as $(cat "$RUNNER_TEMP/pushed"), not $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The attestation is pushed next to the image, so `gh attestation verify oci://...` and
      # registry-side policy tools find it. That push reads Docker's credentials.
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printenv GH_TOKEN | docker login ghcr.io --username "$ACTOR" --password-stdin
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Only once the version is attested, and only forward: `latest` moves to the highest stable
      # version and `X.Y` to the highest stable X.Y.*, so re-running an old release's job (or
      # releasing a 0.1.x fix after 0.2.0) never moves a tag backwards. Pre-releases get neither.
      # The versions are the image tags that exist, not the git tags: an image tag exists only
      # once its release was approved and pushed, so a v* tag whose run was rejected or failed
      # cannot hold `latest`. Strict SemVer numbers only (no leading zeros: v09.0.0 would sort
      # as 9.0.0), and this version must be among them, as it was pushed above.
      - name: Move the X.Y and latest tags
        shell: bash # -eo pipefail: a failed listing must fail the step
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.check.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          case "$VERSION" in *-*) echo "$VERSION is a pre-release: no other tags"; exit 0 ;; esac
          trap 'rm -f "$RUNNER_TEMP/auth.json"' EXIT
          printenv GH_TOKEN | skopeo login --authfile "$RUNNER_TEMP/auth.json" --username "$ACTOR" --password-stdin ghcr.io
          stable=$(skopeo list-tags --authfile "$RUNNER_TEMP/auth.json" "docker://$IMAGE" \
            | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)["Tags"]))' \
            | { grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; } | sort -V)
          printf '%s\n' "$stable" | grep -qxF "$VERSION" || { echo "::error::$IMAGE has no $VERSION tag among: $stable"; exit 1; }
          minor=${VERSION%.*}
          tags=""
          if [ "$(printf '%s\n' "$stable" | awk -F. -v m="$minor" '$1 "." $2 == m' | tail -n 1)" = "$VERSION" ]; then tags="$minor"; fi
          if [ "$(printf '%s\n' "$stable" | tail -n 1)" = "$VERSION" ]; then tags="$tags latest"; fi
          if [ -z "$tags" ]; then echo "newer releases hold $minor and latest"; exit 0; fi
          for tag in $tags; do
            skopeo copy --all --preserve-digests --authfile "$RUNNER_TEMP/auth.json" --digestfile "$RUNNER_TEMP/pushed" \
              oci-archive:image/graphviz-pure-image.tar "docker://$IMAGE:$tag"
            test "$(cat "$RUNNER_TEMP/pushed")" = "$DIGEST" || { echo "::error::$IMAGE:$tag was pushed as $(cat "$RUNNER_TEMP/pushed"), not $DIGEST"; exit 1; }
          done
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  # Checks what the publishing jobs published: the GitHub release's assets and their attestations,
  # the crates on crates.io, npm, JSR, Wasmer, PyPI, and the image's tags and attestation. A
  # channel whose publishing job did not succeed is reported as failing at once, not polled.
  # The tap and bucket were dispatched and are not waited on (scripts/release-verify.sh without
  # --ci checks them). No environment: this job publishes nothing. It runs once any channel
  # published, so a failure in one job still shows the state of the others. On success of the
  # GitHub release it closes a milestone titled X.Y.Z if one is open, and writes no comment.
  verify:
    name: Verify the published release
    if: >-
      !cancelled() && needs.publish.result == 'success' && (needs.github-release.result == 'success'
      || needs.crates-io.result == 'success' || needs.npm.result == 'success'
      || needs.jsr.result == 'success' || needs.ghcr.result == 'success'
      || needs.wasmer.outputs.published == 'true' || needs.pypi.outputs.published == 'true')
    needs: [check, publish, github-release, crates-io, npm, jsr, ghcr, wasmer, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # download the release assets
      attestations: read # gh attestation verify
      issues: write # close the milestone titled with the version; no comment is posted
    steps:
      - uses: $/.github/actions/use-release-commit
        with:
          base-sha: ${{ needs.check.outputs.base_sha }}
          release-sha: ${{ needs.check.outputs.release_sha }}
      # For the binstall channel: cargo-binstall itself installs (as a dry run) the published
      # crate's archive for every release target, from crates.io and the GitHub release.
      - name: Install cargo-binstall ${{ env.BINSTALL_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --output binstall.tgz \
            "https://github.com/cargo-bins/cargo-binstall/releases/download/v$BINSTALL_VERSION/cargo-binstall-x86_64-unknown-linux-musl.tgz"
          echo "$BINSTALL_SHA256  binstall.tgz" | sha256sum --check --strict
          mkdir binstall && tar -xzf binstall.tgz -C binstall cargo-binstall
          echo "$RUNNER_TEMP/binstall" >> "$GITHUB_PATH"
      # The registry checks share one 10-minute deadline, well inside the job's timeout, and the
      # script writes each channel's line as it goes, so the summary always shows what was found.
      - name: Verify every channel but the tap and bucket
        shell: bash # -eo pipefail: a failed check must fail the step
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          CRATES: ${{ needs.crates-io.result }}
          GITHUB: ${{ needs.github-release.result }}
          RESULTS: >-
            github=${{ needs.github-release.result }} crates=${{ needs.crates-io.result }}
            npm=${{ needs.npm.result }} jsr=${{ needs.jsr.result }} ghcr=${{ needs.ghcr.result }}
            wasmer=${{ needs.wasmer.result == 'success' && needs.wasmer.outputs.published != 'true' && 'skipped' || needs.wasmer.result }}
            pypi=${{ needs.pypi.result == 'success' && needs.pypi.outputs.published != 'true' && 'skipped' || needs.pypi.result }}
        run: |
          ok="" failed=""
          # binstall needs both the crate (its metadata) and the GitHub release (its archives);
          # when either failed, that job's failure is reported and binstall is left out.
          if [ "$CRATES" = success ] && [ "$GITHUB" = success ]; then RESULTS="$RESULTS binstall=success"; else RESULTS="$RESULTS binstall=skipped"; fi
          # A channel that is not set up yet (its job succeeded without publishing) is left out.
          for kv in $RESULTS; do
            case "${kv#*=}" in
              success) ok="$ok,${kv%%=*}" ;;
              skipped) ;;
              *) failed="$failed,${kv%%=*}" ;;
            esac
          done
          scripts/release-verify.sh "$VERSION" --ci --wait 600 --channels "${ok#,}" --failed "${failed#,}" |
            tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close the milestone
        if: needs.github-release.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: scripts/release-close-milestone.sh "$VERSION"
