[workspace]
resolver = "2"
members = [
    "crates/graphviz-pure-core",
    "crates/graphviz-pure-parser",
    "crates/graphviz-pure-geom",
    "crates/graphviz-pure-layout",
    "crates/graphviz-pure-render",
    "crates/graphviz-pure",
    "crates/graphviz-pure-wasm",
    "crates/graphviz-pure-cli",
    "crates/graphviz-pure-raster",
    "crates/graphviz-pure-diff",
    "crates/graphviz-pure-portable-libm",
]
# The cargo-fuzz targets are their own workspace, built with nightly only.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "EPL-2.0"
repository = "https://github.com/graphviz-pure/graphviz-pure"
authors = ["graphviz-pure contributors"]
homepage = "https://graphviz-pure.github.io"
readme = "README.md"
keywords = ["graphviz", "dot", "graph", "layout", "svg"]
categories = ["visualization", "rendering", "graphics", "wasm"]
rust-version = "1.85"

[workspace.dependencies]
graphviz-pure-core = { path = "crates/graphviz-pure-core", version = "0.2.1" }
graphviz-pure-parser = { path = "crates/graphviz-pure-parser", version = "0.2.1" }
graphviz-pure-geom = { path = "crates/graphviz-pure-geom", version = "0.2.1" }
graphviz-pure-layout = { path = "crates/graphviz-pure-layout", version = "0.2.1" }
graphviz-pure-render = { path = "crates/graphviz-pure-render", version = "0.2.1" }
graphviz-pure = { path = "crates/graphviz-pure", version = "0.2.1" }
graphviz-pure-raster = { path = "crates/graphviz-pure-raster", version = "0.2.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2.100"
libm = "0.2.16"

[workspace.lints.rust]
unsafe_code = "forbid"
