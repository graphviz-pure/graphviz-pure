[workspace]
resolver = "2"
members = [
    "crates/graphviz-pure-core",
    "crates/graphviz-pure-parser",
    "crates/graphviz-pure-geom",
    "crates/graphviz-pure-layout",
    "crates/graphviz-pure-render",
    "crates/graphviz-pure",
    "crates/graphviz-pure-wasm",
    "crates/graphviz-pure-cli",
    "crates/graphviz-pure-raster",
    "crates/graphviz-pure-diff",
    "crates/graphviz-pure-portable-libm",
]
# The cargo-fuzz targets are their own workspace, built with nightly only.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "EPL-2.0"
repository = "https://github.com/graphviz-pure/graphviz-pure"
authors = ["graphviz-pure contributors"]
homepage = "https://graphviz-pure.github.io"
readme = "README.md"
keywords = ["graphviz", "dot", "graph", "layout", "svg"]
categories = ["visualization", "rendering", "graphics", "wasm"]
rust-version = "1.85"

[workspace.dependencies]
graphviz-pure-core = { path = "crates/graphviz-pure-core", version = "0.2.2" }
graphviz-pure-parser = { path = "crates/graphviz-pure-parser", version = "0.2.2" }
graphviz-pure-geom = { path = "crates/graphviz-pure-geom", version = "0.2.2" }
graphviz-pure-layout = { path = "crates/graphviz-pure-layout", version = "0.2.2" }
graphviz-pure-render = { path = "crates/graphviz-pure-render", version = "0.2.2" }
graphviz-pure = { path = "crates/graphviz-pure", version = "0.2.2" }
graphviz-pure-raster = { path = "crates/graphviz-pure-raster", version = "0.2.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2.100"
libm = "0.2.16"

[workspace.lints.rust]
unsafe_code = "forbid"

# Raster crates call f32/f64 transcendental methods. Those inherent methods ignore a
# `libm` feature while `std` is on, and PNG encoding needs `std`, so the crates.io
# features cannot route `-Tpng` through the portable math. The copies under vendor/
# rename the call sites onto the `libm` crate. See vendor/README.md.
# [patch] applies to this workspace (CI, release binaries, wasm). It does not apply
# when a downstream crate depends on a crates.io release of graphviz-pure.
[patch.crates-io]
kurbo = { path = "vendor/kurbo" }
skrifa = { path = "vendor/skrifa" }
svgtypes = { path = "vendor/svgtypes" }
tiny-skia = { path = "vendor/tiny-skia" }
tiny-skia-path = { path = "vendor/tiny-skia-path" }

# Profiles apply only to the workspace being built: here they hold for CI, the release binaries
# and the source-tarball packages. A crates.io install builds graphviz-pure-cli as its own
# workspace, so that crate's manifest repeats the release profile (keep the two in step).
[profile.dev]
opt-level = 1
debug = 1

[profile.test]
opt-level = 1
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Without its symbol table the CLI is 0.95 MB smaller; panic backtraces lose function names (#540).
[profile.release.package.graphviz-pure-cli]
strip = true
