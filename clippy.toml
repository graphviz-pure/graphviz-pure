msrv = "1.88"

# Every diagnostic goes through `graphviz_pure_core::diag` (C's `agerr` sink: the `-q` level,
# `\ooo` escaping, `AGPREV`), or `diag::fprintf_stderr` where C writes with a bare `fprintf`.
disallowed-macros = [
    { path = "std::eprintln", reason = "write diagnostics through graphviz_pure_core::diag" },
    { path = "std::eprint", reason = "write diagnostics through graphviz_pure_core::diag" },
]
# Every transcendental function goes through `graphviz_pure_core::math`, which calls the same
# portable implementations on every target, so no build computes with a platform libm. Only
# `math::portable` itself (and the test comparing it with the system libm) may use them.
# `sqrt` and `mul_add` are correctly rounded everywhere and stay allowed.
disallowed-methods = [
    { path = "std::io::stderr", reason = "write diagnostics through graphviz_pure_core::diag" },
    { path = "f64::sin", reason = "call graphviz_pure_core::math, the same portable functions on every platform (docs/porting/libm.md)" },
    { path = "f64::cos", reason = "call graphviz_pure_core::math, the same portable functions on every platform (docs/porting/libm.md)" },
    { path = "f64::tan", reason = "call graphviz_pure_core::math, the same portable functions on every platform (docs/porting/libm.md)" },
