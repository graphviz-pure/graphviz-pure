[package]
name = "graphviz-pure-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
readme.workspace = true
homepage.workspace = true
description = "graphviz-pure, a dot-compatible command line for the pure-Rust port of Graphviz 16.1.0"

[[bin]]
name = "graphviz-pure"
path = "src/main.rs"
# The library crate graphviz-pure owns the rustdoc name.
doc = false

# `cargo binstall graphviz-pure-cli` installs the release's attested archive for the host instead of
# compiling (https://github.com/cargo-bins/cargo-binstall). The names are scripts/release-package.py's;
# release.yml and scripts/release-verify.sh check them against the release's archives
# (scripts/check-binstall.py). Linux hosts get the static musl build.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/graphviz-pure-{ version }-{ target }{ archive-suffix }"
bin-dir = "graphviz-pure-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# Never third-party builds (cargo-quickinstall); compiling from crates.io stays the fallback.
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
graphviz-pure-core.workspace = true
graphviz-pure-parser.workspace = true
graphviz-pure-layout.workspace = true
graphviz-pure-render.workspace = true
graphviz-pure-raster.workspace = true

# The perf ratchet's heap counts (examples/heap_counts.rs, scripts/bench/ratchet.py). Only the
# example uses it: the shipped binary keeps the system allocator.
[dev-dependencies]
dhat = "0.3"

[lints]
workspace = true

# `cargo install graphviz-pure-cli` from crates.io builds this crate as its own workspace, which
# reads only this manifest's profiles; a build in this repository reads the workspace Cargo.toml's
# instead (Cargo warns that this one is ignored there). Keep the two in step (#540).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
