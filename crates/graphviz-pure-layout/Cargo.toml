[package]
name = "graphviz-pure-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
readme.workspace = true
homepage.workspace = true
description = "The Graphviz layout engines in pure Rust: dot, neato, fdp, sfdp, twopi, circo, osage, patchwork"

[features]
# Check mode for network simplex: every cut-set pivot also runs the functions that mirror
# `ns.c` and asserts that both agree (common/ns/cut/check.rs). For tests and CI only: it
# costs C's full network simplex on top of the cut sets'.
ns-check = []
# Check mode for pathplan's shortcuts: each also computes C's answer and asserts that both agree
# (docs/perf/pathplan-shortcuts.md). For tests and CI only.
routing-check = ["graphviz-pure-geom/pathplan-check"]
# Check mode for dot's mincross: every shortcut in dotgen/mincross/scan.rs also runs the functions
# that mirror `mincross.c` and asserts that both agree (dotgen/mincross/scan/check.rs). For tests
# and CI only: it costs C's full reorder and transpose on top of the shortcuts'.
mincross-check = []
# Native only. Off unless a crate above asks for it. The wasm build refuses
# this feature (see src/lib.rs). Thread count: `GRAPHVIZ_PURE_THREADS`.
parallel = []

[dependencies]
graphviz-pure-core.workspace = true
graphviz-pure-geom.workspace = true

[lints]
workspace = true
