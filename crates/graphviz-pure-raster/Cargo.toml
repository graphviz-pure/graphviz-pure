[package]
name = "graphviz-pure-raster"
version.workspace = true
edition.workspace = true
license = "EPL-2.0 AND OFL-1.1"
repository.workspace = true
categories.workspace = true
keywords.workspace = true
readme.workspace = true
homepage.workspace = true
description = "PNG and JPEG output for graphviz-pure: rasterizes its SVG with resvg and bundled metric-compatible fonts"
# The bundled fonts (fonts/) are under the SIL Open Font License 1.1; see fonts/OFL-*.txt.
include = [
    "src/**",
    "fonts/*.ttf",
    "fonts/OFL-*.txt",
    "fonts/SHA256SUMS",
    "Cargo.toml",
    "LICENSE",
    "NOTICE",
]

[dependencies]
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }

[dev-dependencies]
graphviz-pure-core = { workspace = true }
kurbo = "0.13.1"
sha2 = "0.10"

[lints]
workspace = true
