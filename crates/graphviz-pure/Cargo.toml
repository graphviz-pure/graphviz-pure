[package]
name = "graphviz-pure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
readme.workspace = true
homepage.workspace = true
description = "A pure-Rust port of Graphviz 16.1.0 with the same output on every platform: parse DOT, lay it out with any of the eight engines and render SVG and more, with no C and no FFI. Not affiliated with the Graphviz project."

[features]
# Opt-in for library users and source builds. Off by default. Native only:
# the wasm crate does not forward it, and a wasm build that turns it on
# fails to compile.
parallel = ["graphviz-pure-layout/parallel"]

[dependencies]
graphviz-pure-core = { path = "../graphviz-pure-core", version = "=1.0.0" }
graphviz-pure-parser = { path = "../graphviz-pure-parser", version = "=1.0.0" }
# Present only so this manifest can pin geom with `=`.
graphviz-pure-geom = { path = "../graphviz-pure-geom", version = "=1.0.0" }
graphviz-pure-layout = { path = "../graphviz-pure-layout", version = "=1.0.0" }
graphviz-pure-render = { path = "../graphviz-pure-render", version = "=1.0.0" }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
