# OSS-Fuzz project metadata for graphviz-pure.
# https://google.github.io/oss-fuzz/docs/project-requirements/
#
# The fuzz targets live in the repository itself (fuzz/), so the repository is
# the project: OSS-Fuzz clones it and builds the cargo-fuzz targets.
homepage: "https://github.com/graphviz-pure/graphviz-pure"
language: rust
main_repo: "https://github.com/graphviz-pure/graphviz-pure"
help_url: "https://github.com/graphviz-pure/graphviz-pure/blob/master/docs/porting/fuzzing.md"

# TODO(owner): replace this with the address of the maintainer who should get
# the OSS-Fuzz notifications (build failures, new crash reports). example.com is
# reserved for documentation (RFC 2606), so it can never reach a real mailbox;
# OSS-Fuzz only checks that the address has the shape of one.
primary_contact: "TODO-REPLACE-ME@example.com"

sanitizers:
  - address
fuzzing_engines:
  - libfuzzer
